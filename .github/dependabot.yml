version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - swiftpm
    groups:
      sparkle:
        patterns:
          - "Sparkle"
      huggingface:
        patterns:
          - "swift-transformers"
          - "swift-transformers-*"
